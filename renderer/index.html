<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌面待办</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app" class="app collapsed">

  <!-- 拖动把手 -->
  <div id="drag-handle" class="drag-handle"></div>

  <div class="capsule-row">
      <div id="capsule" class="capsule">
        <div class="capsule-inner">
          <svg class="capsule-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            <line x1="8" y1="7" x2="16" y2="7"/>
            <line x1="8" y1="11" x2="14" y2="11"/>
          </svg>
          <span class="capsule-title">代办事项</span>
          <span id="badge" class="badge" style="display:none">0</span>
          <svg id="expand-arrow" class="expand-arrow" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
      </div>

      <button id="add-btn" class="float-btn add-btn" title="添加待办">+</button>
    </div>

    <!-- 展开面板 -->
    <div id="panel" class="panel">
      <div id="input-panel" class="input-panel">
        <input id="todo-input" class="todo-input" type="text" placeholder="输入待办事项…" maxlength="30" autocomplete="off">
        <div class="priority-row">
          <button class="priority-btn priority-high" data-priority="high" title="紧急">
            <span class="priority-dot red"></span>紧急
          </button>
          <button class="priority-btn priority-medium active" data-priority="medium" title="普通">
            <span class="priority-dot orange"></span>普通
          </button>
          <button class="priority-btn priority-low" data-priority="low" title="低优先">
            <span class="priority-dot green"></span>低优先
          </button>
        </div>
        <div class="input-actions">
          <button id="submit-btn" class="submit-btn">添加</button>
          <button id="cancel-btn" class="cancel-btn">取消</button>
        </div>
        <span id="limit-hint" class="limit-hint" style="display:none">未完成事项已达上限（30条）</span>
      </div>

      <div id="todo-list" class="todo-list"></div>

      <div id="empty-state" class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="15" y2="15"/>
        </svg>
        <span>暂无待办事项</span>
      </div>

      <div id="completed-section" class="completed-section">
        <div id="completed-header" class="completed-header">
          <svg class="completed-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
          <span>已完成事件</span>
          <span id="completed-count" class="completed-count">0</span>
          <button id="clear-completed" class="clear-completed" title="清空已完成">清空</button>
        </div>
        <div id="completed-list" class="completed-list"></div>
      </div>
    </div>

</div>

<script src="renderer.js"></script>
</body>
</html>
